<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#F5F4F0">
<meta name="description" content="Dukaan OS — smart billing, inventory and udhaar ledger for local shopkeepers.">
<title>Dukaan OS — दुकान का डिजिटल काउंटर</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23161615'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='36' font-style='italic' text-anchor='middle' fill='%23F5F4F0'%3ED%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ══════════ AUTH (sign up / log in) ══════════ -->
<div id="authScreen" class="auth-screen" hidden>
  <div class="auth-card">
    <div class="wordmark">Dukaan<span>OS</span></div>
    <p class="muted" id="authSub">Sign in to open your counter</p>
    <p class="muted" data-core-text="This account works only in this browser. Online sign-in and password recovery are not available yet.">This account works only in this browser. Online sign-in and password recovery are not available yet.</p>
    <button type="button" class="btn sm" id="authLang" aria-label="Language / भाषा">हिन्दी / English</button>

    <div class="auth-tabs" id="authTabs">
      <button type="button" class="auth-tab on" data-mode="login" data-core-text="Log in">Log in</button>
      <button type="button" class="auth-tab" data-mode="signup" data-core-text="Sign up">Sign up</button>
    </div>

    <form id="authForm" class="auth-form" autocomplete="on">
      <div class="field" id="fShop" hidden>
        <label for="a_shop" data-core-text="Shop name">Shop name</label>
        <input class="inp" id="a_shop" placeholder="Sharma General Store" autocomplete="organization">
      </div>
      <div class="field">
        <label for="a_user" data-core-text="Username">Username</label>
        <input class="inp" id="a_user" placeholder="raj123" autocomplete="username" autocapitalize="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="a_pass" data-core-text="Password">Password</label>
        <input class="inp" id="a_pass" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <div class="field" id="fConfirm" hidden>
        <label for="a_pass2" data-core-text="Confirm password">Confirm password</label>
        <input class="inp" id="a_pass2" type="password" placeholder="••••••••" autocomplete="new-password">
      </div>
      <p class="auth-err" id="authErr" role="alert" tabindex="-1"></p>
      <button type="submit" class="btn pri big block" id="authSubmit">Log in</button>
    </form>
    <p class="muted auth-switch" id="authSwitch"></p>
  </div>
</div>

<!-- ══════════ PIN LOCK ══════════ -->
<div id="lockScreen" class="lock-screen" hidden>
  <div class="lock-card">
    <div class="wordmark">Dukaan<span>OS</span></div>
    <h2 id="lockTitle">Dukaan OS</h2>
    <p id="lockSub" class="muted"></p>
    <div class="pin-dots" id="pinDots" role="status" aria-live="polite"></div>
    <div class="pin-pad" id="pinPad"></div>
    <p class="pin-err" id="pinErr"></p>
  </div>
</div>

<!-- ══════════ BOOT SKELETON ══════════ -->
<div id="boot" class="boot">
  <div class="boot-inner">
    <div class="boot-name">Dukaan<span>OS</span></div>
    <div class="boot-bar"><i></i></div>
  </div>
</div>

<!-- ══════════ APP SHELL ══════════ -->
<div id="shell" class="shell" hidden>

  <header class="topbar">
    <button class="icon-btn only-mobile" id="btnMenu" aria-label="Menu" data-icon="menu"></button>
    <div class="brand">
      <span class="brand-text">Dukaan<b>OS</b></span>
    </div>
    <div class="store-pill" id="storePill" role="button" tabindex="0"></div>
    <div class="spacer"></div>
    <div class="net-pill" id="netPill" title="Connection"><i></i><span></span></div>
    <button class="icon-btn" id="btnLang" title="भाषा / Language">EN</button>
    <button class="icon-btn" id="btnTheme" title="Theme" data-icon="moon"></button>
    <button class="icon-btn" id="btnLock" title="Lock" data-icon="lock"></button>
    <button class="icon-btn" id="btnLogout" title="Log out" data-icon="logout"></button>
    <div class="who" id="whoPill"></div>
  </header>

  <div class="body">
    <nav class="sidenav" id="sidenav">
      <button class="nav-item" data-view="dashboard"><span class="ni" data-icon="home"></span><span class="nt" data-i18n="nav.dashboard"></span></button>
      <button class="nav-item" data-view="billing"><span class="ni" data-icon="receipt"></span><span class="nt" data-i18n="nav.billing"></span></button>
      <button class="nav-item" data-view="inventory"><span class="ni" data-icon="box"></span><span class="nt" data-i18n="nav.inventory"></span></button>
      <button class="nav-item" data-view="customers"><span class="ni" data-icon="users"></span><span class="nt" data-i18n="nav.customers"></span></button>
      <button class="nav-item" data-view="suppliers"><span class="ni" data-icon="truck"></span><span class="nt" data-i18n="nav.suppliers"></span></button>
      <button class="nav-item" data-view="reports"><span class="ni" data-icon="chart"></span><span class="nt" data-i18n="nav.reports"></span></button>
      <button class="nav-item" data-view="settings"><span class="ni" data-icon="settings"></span><span class="nt" data-i18n="nav.settings"></span></button>
      <div class="nav-foot">
        <div class="health-mini" id="healthMini"></div>
      </div>
    </nav>
    <div class="scrim" id="scrim"></div>

    <main class="main" id="main"></main>
  </div>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-view="dashboard"><span class="ni" data-icon="home" data-size="20"></span><i data-i18n="nav.dashboard"></i></button>
    <button class="tab" data-view="inventory"><span class="ni" data-icon="box" data-size="20"></span><i data-i18n="nav.inventory"></i></button>
    <button class="tab tab-fab" data-view="billing"><span class="ni" data-icon="receipt" data-size="20"></span><i data-i18n="nav.bill"></i></button>
    <button class="tab" data-view="customers"><span class="ni" data-icon="users" data-size="20"></span><i data-i18n="nav.customers"></i></button>
    <button class="tab" data-view="reports"><span class="ni" data-icon="chart" data-size="20"></span><i data-i18n="nav.reports"></i></button>
  </nav>
</div>

<!-- ══════════ OVERLAYS ══════════ -->
<div id="modalRoot"></div>
<div id="sheetRoot"></div>
<div id="toastRoot" class="toast-root" aria-live="polite"></div>
<canvas id="fxCanvas" class="fx-canvas"></canvas>
<div id="voiceOrb" class="voice-orb" hidden>
  <div class="orb-ring"></div><div class="orb-ring r2"></div>
  <div class="orb-core" data-icon="mic" data-size="40"></div>
  <div class="orb-text" id="orbText"></div>
  <button class="orb-stop" id="orbStop" data-icon="x" data-size="20" aria-label="Stop"></button>
</div>

<script src="js/domain.js"></script>
<script src="js/storage.js"></script>
<script src="js/indexeddb.js"></script>
<script src="js/core.js"></script>
<script src="js/safety.js"></script>
<script src="js/migrations.js"></script>
<script src="js/i18n.js"></script><script src="js/core-accessibility.js"></script>
<script src="js/money-language.js"></script>
<script src="js/quantity-units.js"></script>
<script src="js/qr.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/backup.js"></script>
<script src="js/returns.js"></script>
<script src="js/supplier-corrections.js"></script>
  <script src="js/stock-adjustments.js"></script>
  <script src="js/stores-transfers.js"></script>
  <script src="js/cash-shifts.js"></script><script src="js/statements.js"></script>
<script src="js/voice.js"></script>
<script src="js/thermal-receipts.js"></script>
<script src="js/pos.js"></script>
<script src="js/inventory.js"></script>
<script src="js/ledger.js"></script>
<script src="js/insights.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
